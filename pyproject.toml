[project]
name = "itch-jams-mcp"
version = "0.2.0"
description = "MCP server that exposes itch.io game jams and games to LLM clients"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "petrarka" }]
keywords = ["mcp", "itch.io", "game-jam", "indie-games", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mcp>=1.3.0,<2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "starlette>=0.36",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/petrarka/itch-jams-mcp"
Issues = "https://github.com/petrarka/itch-jams-mcp/issues"

[project.scripts]
itch-jams-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
